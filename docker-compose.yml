services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders_console
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_console"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run dev:docker
    environment:
      PORT: "4000"
      NODE_ENV: development
      DATABASE_URL: postgresql://orders:orders@db:5432/orders_console
    ports:
      - "8000:4000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
