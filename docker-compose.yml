services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders_console
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_console"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: >
      sh -c "npx prisma migrate deploy && npm run seed"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://orders:orders@db:5432/orders_console
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run dev:docker
    environment:
      PORT: "4000"
      NODE_ENV: development
      DATABASE_URL: postgresql://orders:orders@db:5432/orders_console
      JWT_SECRET: 00b99321c493a77966de5769cf14c09ecbfa098d7773125d2c4846c83f6f05bddb766fa8a018acefc9c3c0a638fd36ca12cd7af79b54829b09043cd414ef93bf
      CLIENT_ORIGIN: "http://localhost:5173"
    ports:
      - "8000:4000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
